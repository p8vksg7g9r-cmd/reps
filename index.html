<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#002E3A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="REPS" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="icon" href="assets/icons/icon-192.png" />
  <title>REPS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Archivo+Narrow:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" />

  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <a id="active-bar" class="active-bar hidden" href="#"></a>
  <main id="view" class="app" role="main"></main>
  <main id="session-view" class="app hidden" role="main"></main>

  <nav class="tabbar" aria-label="Primary">
    <a href="#/home"      data-tab="home"><span class="dot"></span>Home</a>
    <a href="#/exercises" data-tab="exercises"><span class="dot"></span>Lifts</a>
    <a href="#/history"   data-tab="history"><span class="dot"></span>History</a>
    <a href="#/profile"   data-tab="profile"><span class="dot"></span>Profile</a>
  </nav>

  <!-- Portrait-only gate. iOS has no JS orientation-lock API and ignores the
       manifest orientation for many home-screen PWAs, so this CSS-only overlay
       is the only reliable way to keep REPS in portrait there. -->
  <div id="rotate-gate" role="alertdialog" aria-label="Rotate your device to portrait">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="8" y="2" width="8" height="20" rx="2"/>
      <path d="M12 18h.01"/>
      <path d="M20 9a8 8 0 0 0-6-3"/>
      <polyline points="14 3 14 6 11 6"/>
    </svg>
    <div class="rg-title">Rotate to portrait</div>
    <div class="rg-sub">REPS works in portrait only</div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
